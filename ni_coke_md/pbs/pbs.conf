# PBS settings for ni_coke_md (sourced by pbs/submit.sh and pbs/job.pbs). Edit to match your cluster.

QUEUE=compute            # #PBS -q
CORES_PER_NODE=32        # cores per compute node
THREADS_PER_CASE=4       # OpenMP threads per case; 4 is the sweet spot for ~200-atom ReaxFF
FULL_NODE=0              # 1 = always request the whole node (ncpus=CORES_PER_NODE) even for <8 cases
WALLTIME=""              # e.g. "72:00:00"; empty = read resources_max.walltime of the queue, else 24:00:00
MARGIN_H=1.0             # stop cases this many hours before the walltime (one checkpoint ~ 15-30 min)
MAX_RESUB=40             # safety limit on automatic resubmissions of one chain of jobs
AUTO_TASK2=1             # 1 = when the task1 cases task2 starts from are finished, submit task2 automatically
PBS_SOFTWARE=""          # if your site requires "-l software=XXX" put XXX here (your VASP script used VASP)
EXTRA_QSUB=""            # anything else for qsub, e.g. "-P myproject" or "-l place=excl"
