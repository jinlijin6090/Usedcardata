# EC（碳酸乙烯酯）化学空间硬枚举：配置文件
# 一般只需要改 [space] 里的 max_heavy，和 [write] 里的 derive_max_heavy。
# 也可以不改文件，在命令行覆盖任意一项：  bash run.sh config.ini --set space.max_heavy=10

[space]
# 物种最大重原子数（C + O）。两个 EC 的重原子数是 12。
max_heavy = 12
# 碳、氧原子数上限（不限制就写成和 max_heavy 一样）
max_C = 12
max_O = 12
# 只输出 H 数不超过该值的物种；留空表示不限制（硬枚举时留空）
max_H =
# 过氧键 O–O：yes = 允许单个 O–O（过氧化物），但去掉 O–O–O 链；no = 完全不允许 O–O
allow_peroxide = yes
# 张力过滤：valence = 只去掉几何上不可能的结构（小于 8 元环里的三键或累积双键）；
#           plausible = 再去掉同一原子处在两个 ≤4 元环里、桥环、丁三烯以上累积多烯
strain_filter = valence
# 额外加入的特殊物种（不能用常规价态写出的），逗号分隔
special = [C-]#[O+]
# 起始物种（网页里路径搜索的起点）
start = O=C1OCCO1

[species]
# 单一修饰：自由基位点、负离子位点、正离子位点、O 质子化、整体加/失电子（自由基离子）
radicals = yes
anions = yes
# 正离子（去掉 H⁻）允许的中心原子：C 表示只要碳正离子；C,O 表示也要氧正离子（oxenium，极不稳定）
cation_centers = C
protonation = yes
radical_ions = yes
# 双重修饰（成对的位点）：distonic = 自由基 + 负离子（如 EC 开环后的 •CH2CH2OCO2⁻）；
# dianion = 两个 O 负离子（如 LEDC 的二价阴离子）；biradical = 两个自由基位点；zwitterion = 正负离子对；
# radical_cation_pair = 自由基 + 碳正离子
pairs = distonic, dianion
# 同一原子上去掉两个 H 得到卡宾（仅当 pairs 里有 biradical 时生效）
carbenes = yes
# Li⁺ 配位：每个物种最多配几个 Li（0、1、2），Li 只配在 O 上
li_max = 2
# 允许的总电荷
charges = -2, -1, 0, 1

[reactions]
# 要生成的基元反应族（都是“单个物种 + 小分子池”或单分子反应；任意两个大物种之间的双分子反应不枚举）
families = h_loss, deprotonation, hydride_loss, protonation, electron_capture, electron_loss,
           site_electron_transfer, li_binding, homolysis, heterolysis, beta_scission,
           radical_anion_fragmentation, radical_cation_fragmentation, pair_steps

[write]
# 闭壳层中性分子全部写出（所有重原子数）。
# 自由基、离子、Li 配位物和反应：重原子数 ≤ derive_max_heavy 的逐条写出；更大的只按抽样统计数量。
derive_max_heavy = 9
# 超过 derive_max_heavy 的层，抽样比例（用于估算派生物种和反应的数量）
count_sample = 0.002
# 输出压缩级别（1 最快，9 最小）
gzip_level = 3

[run]
# 输出目录（相对路径相对于本配置文件所在目录）
out = ./ec_space_out
# 进程数：auto = 自动读取 SLURM / PBS / LSF 分配的核数，否则用本机全部核
workers = auto
# 每层分片数：auto 根据预计规模决定（每片约 200 万个物种）
shards = auto
# 只打印规模估算、不真正运行
dry_run = no

[viewer]
# 网页预览包含的最大重原子数（不超过 derive_max_heavy；7 约 150 万物种，浏览器里可以流畅分级加载）
max_heavy = 7
# 网页预览：每个（物种类别 × 重原子数）格子最多放多少个物种
max_per_cell = 200000
# 网页最多包含多少个物种（超过则按格子等比例抽样）
max_species = 2000000
