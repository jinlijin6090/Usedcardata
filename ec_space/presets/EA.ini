# 预设：EA 乙酸乙酯 CCOC(C)=O（C₄H₈O₂，6 个重原子）
# 只写和基础配置 ../config.ini 不同的项，其余全部继承。
# 运行：（在 ec_space 目录下）bash run.sh presets/EA.ini     或  python run.py presets/EA.ini

[include]
base = ../config.ini

[solvent]
solvents = EA

[space]
# 路径搜索的起点
start = CCOC(C)=O
# 方案 B（可选）：只要“原子最多来自两个溶剂分子”的物种（2 × EA = C₈H₁₆O₄）时，取消下面三行的注释，并把 run.out 换成单独的目录。
# 这样空间会小很多，但不能和其他溶剂共用基础数据。
# max_C = 8
# max_O = 4
# max_H = 16

[run]
# 方案 A（默认）：所有溶剂共用同一个基础空间目录。第一次运行会算基础空间（约 1400 核时），
# 之后换溶剂只需：bash run.sh presets/<其他溶剂>.ini --stages solvent,stats,viewer
out = ../ec_space_out
